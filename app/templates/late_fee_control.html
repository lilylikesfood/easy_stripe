<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Late Fee Control</title>
</head>
<body>
    <h1>Late Fee Control</h1>

    <h2>Audit Summary</h2>
    <p>Late Fee Month: {{audit.summary.late_fee_month}}</p>
    <p>Total Candidate: {{audit.summary.candidate_count}}</p>
    <p>Eligible: {{audit.summary.eligible_count}}</p>
    <p>Skipped: {{audit.summary.skipped_count}}</p>
    <p>Total Late Fee: {{audit.summary.total_late_fee}}</p>

    <hr>

    <form method="POST" action="/admin/apply-late-fees">
        <input type="hidden" name="confirm" value="APPLY">
        <input type="hidden" name="mode" value="live">

        <button type="submit" onclick="return confirm('Are you sure you want to apply LIVE late fees?');">Apply LIVE Late Fees</button>
    </form>


</body>
</html>
